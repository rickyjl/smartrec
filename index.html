<!DOCTYPE html>
<html>
<head>
    <title>Spotify Cluster Explorer</title>
    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }
        .song-box {
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
                @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 30px;
            text-align: center;
            background: linear-gradient(135deg, #0d1b2a, #1b263b);
            color: #e0e6ed;
        }
        
        /* Title */
        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        /* Subtitle */
        p {
            font-size: 1.1rem;
            opacity: 0.85;
        }
        
        /* Dropdown + Button container */
        select, button {
            padding: 12px 18px;
            margin: 10px;
            border-radius: 10px;
            border: none;
            font-size: 1rem;
            background: #415a77;
            color: white;
            cursor: pointer;
            transition: 0.2s ease;
        }
        
        /* Hover effects */
        select:hover, button:hover {
            background: #5f85a1;
        }
        
        /* Results container */
        #results {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* Song box styling */
        .song-box {
            width: 80%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 15px;
            margin: 10px 0;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            transition: transform 0.2s ease, background 0.2s ease;
        }
        
        /* Hover glow */
        .song-box:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.1);
        }

    </style>
</head>
<body>

<h1>Spotify Song Cluster Explorer</h1>
<p>Select a cluster and view 10 random songs.</p>

<select id="clusterSelect">
    <option value="" disabled selected>Select a cluster</option>
</select>

<button onclick="showSongs()">Show Songs</button>

<h2>Results</h2>
<div id="results"></div>

<script>
    let allSongs = [];

    // Load JSON file
    fetch("clustered_songs.json")
        .then(response => response.json())
        .then(data => {
            allSongs = data;

            // Populate dropdown
            const dropdown = document.getElementById("clusterSelect");
            for (let i = 0; i < 13; i++) {
                const option = document.createElement("option");
                option.value = i;
                option.textContent = "Cluster " + i;
                dropdown.appendChild(option);
            }
        });

    function showSongs() {
        const clusterID = parseInt(document.getElementById("clusterSelect").value);
        const resultsDiv = document.getElementById("results");
        resultsDiv.innerHTML = "";

        if (isNaN(clusterID)) return;

        // Filter songs by cluster
        const clusterSongs = allSongs.filter(song => song.cluster === clusterID);

        if (clusterSongs.length === 0) {
            resultsDiv.innerHTML = "<p>No songs found for this cluster.</p>";
            return;
        }

        // Randomly pick 10 songs
        const randomSongs = clusterSongs
            .sort(() => 0.5 - Math.random())
            .slice(0, 10);

        // Display songs
        randomSongs.forEach(song => {
            const box = document.createElement("div");
            box.className = "song-box";
            box.innerHTML = `
                <strong>${song.name}</strong><br>
                Artist: ${song.artists}<br>
                Valence: ${song.valence}<br>
                Energy: ${song.energy}
            `;
            resultsDiv.appendChild(box);
        });
    }
</script>

</body>
</html>
